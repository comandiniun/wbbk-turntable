<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kit Turntable Prototype</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap');a

  :root {
    --bg-deep: #0c1420;
    --bg-panel: #121d2c;
    --line: #24384e;
    --signal: #ff8a3d;
    --signal-dim: #ff8a3d55;
    --text: #e8eef5;
    --text-dim: #7f92a8;
    --ok: #46e0b8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 30%, #14233a 0%, var(--bg-deep) 70%);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    overflow: hidden;
  }
  canvas { display: block; }

  #hud {
    position: fixed; inset: 0; z-index: 10; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 28px 32px;
  }
  #hud * { pointer-events: auto; }

  .eyebrow {
    font-size: 11px; letter-spacing: 0.18em; color: var(--signal);
    text-transform: uppercase; margin: 0 0 4px 0;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px; font-weight: 700; margin: 0;
    letter-spacing: -0.01em;
  }
  .sub {
    font-size: 12px; color: var(--text-dim); margin-top: 6px; max-width: 420px; line-height: 1.5;
  }

  #legend {
    position: absolute; top: 28px; right: 32px;
    display: flex; flex-direction: column; gap: 8px;
    align-items: flex-end;
  }
  .kit-chip {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: 0.05em; color: var(--text-dim);
    border: 1px solid var(--line); background: rgba(18,29,44,0.7);
    padding: 6px 10px; border-radius: 3px;
    transition: all 0.2s ease;
  }
  .kit-chip.active { color: var(--text); border-color: var(--signal); }
  .swatch { width: 8px; height: 8px; border-radius: 1px; flex-shrink: 0; }

  #statebar {
    display: flex; align-items: center; gap: 14px;
    align-self: flex-start;
  }
  .btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    background: var(--bg-panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 10px 16px; cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .btn:hover { border-color: var(--signal); color: var(--signal); }
  .btn:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
  .btn[hidden] { display: none; }

  #breadcrumb {
    font-size: 11px; color: var(--text-dim); letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  #breadcrumb .current { color: var(--ok); }

  #hint {
    position: absolute; bottom: 28px; right: 32px;
    font-size: 11px; color: var(--text-dim); text-align: right; line-height: 1.6;
    max-width: 260px;
  }
  #hint kbd {
    background: var(--bg-panel); border: 1px solid var(--line);
    padding: 1px 5px; border-radius: 2px; color: var(--signal);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* --- inspect vignette: attenuates the background so the isolated,
     rotating item reads clearly against it --- */
  #vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    /* frosted glass: blur + lighten the surrounding scene instead of
       darkening it, with a masked-out hole so the inspected item itself
       stays perfectly sharp and unaffected */
    background: rgba(232, 238, 245, 0.10);
    backdrop-filter: blur(22px) saturate(115%) brightness(1.12);
    -webkit-backdrop-filter: blur(22px) saturate(115%) brightness(1.12);
    /* the inspected item is WebGL content painted on the same canvas the
       blur reads from — it can't be "raised above" the frost via z-index.
       the only way to exempt it is a masked hole. computeInspectTransform
       always centers the item at true screen middle, so an exact-fit hole
       here stays aligned with it; frost is full-bleed everywhere else. */
    -webkit-mask-image: radial-gradient(circle at 50% 52%,
      transparent 0,
      transparent 20vh,
      rgba(0,0,0,0.25) 28vh,
      rgba(0,0,0,0.65) 38vh,
      #000 52vh);
    mask-image: radial-gradient(circle at 50% 52%,
      transparent 0,
      transparent 20vh,
      rgba(0,0,0,0.25) 28vh,
      rgba(0,0,0,0.65) 38vh,
      #000 52vh);
    opacity: 0;
    transition: opacity 0.45s ease;
  }
  #vignette.active { opacity: 1; }

  /* --- callout / inspect tag --- */
  #calloutSvg {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 5;
    opacity: 0; transition: opacity 0.25s ease;
  }
  #calloutSvg.active { opacity: 1; }
  #calloutLabel {
    position: fixed; z-index: 6; pointer-events: none;
    opacity: 0; transform: translateY(4px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    max-width: 220px;
  }
  #calloutLabel.active { opacity: 1; transform: translateY(0); }
  .callout-eyebrow {
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--signal); margin: 0 0 3px 0;
  }
  .callout-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px; font-weight: 700; color: var(--text);
    background: rgba(18,29,44,0.88); border: 1px solid var(--line);
    border-left: 2px solid var(--signal);
    padding: 8px 12px; border-radius: 2px;
    white-space: nowrap;
  }
  .callout-sub {
    font-size: 10px; color: var(--text-dim); margin-top: 4px; letter-spacing: 0.04em;
  }
</style>
</head>
<body>

<div id="hud">
  <div style="display:flex; justify-content:space-between; align-items:flex-start;">
    <div>
      <p class="eyebrow">Field Deployment / Broadband Mobile</p>
      <h1>Kit Turntable</h1>
      <p class="sub">Click a kit to open it. Click a component to inspect it in isolation. Placeholder geometry — swap in your rendered .glb kits when ready.</p>
    </div>
    <div id="legend"></div>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:flex-end;">
    <div id="statebar">
      <button class="btn" id="backBtn" hidden>&larr; Back</button>
      <span id="breadcrumb">Turntable</span>
    </div>
    <div id="hint">Drag to orbit &middot; <kbd>click</kbd> a kit or item</div>
  </div>
</div>

<div id="vignette"></div>
<svg id="calloutSvg"><line id="calloutLine" x1="0" y1="0" x2="0" y2="0" stroke="#ff8a3d" stroke-width="1.5" stroke-dasharray="3 3" /><circle id="calloutDot" r="3.5" fill="#ff8a3d" /></svg>
<div id="calloutLabel">
  <p class="callout-eyebrow" id="calloutKit">Kit</p>
  <div class="callout-name" id="calloutName">Item</div>
  <p class="callout-sub">Click again to return to kit</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
// ---------------------------------------------------------------
// CONFIG: the four kits and their placeholder contents
// ---------------------------------------------------------------
const SHAPES = ['box','cylinder','cone','torus'];
function fillerItems(names) {
  return names.map((n, i) => ({ name: n, shape: SHAPES[i % SHAPES.length] }));
}

const KITS = [
  { name: 'Primary',   color: 0xff8a3d, items: fillerItems([
    'Sharpie', 'Tape', 'Sealed bag', 'Gloves',
  ])},
  { name: 'Donor',      color: 0x46e0b8, items: fillerItems([
    'Plasters', 'Blood bag', 'Attenuator', 'Patch Panel', 'Coupler',
    'Test Meter', 'Adapter A', 'Adapter B', 'Grounding Strap', 'Sealing Tape',
  ])},
  { name: 'Recipient',  color: 0x5aa9ff, items: fillerItems([
    'Router', 'Mount Bracket', 'Power Supply', 'Patch Cable A', 'Patch Cable B',
    'Grounding Clamp', 'Signal Booster', 'Weatherproof Enclosure', 'Fuse Kit', 'Mounting Bolts',
  ])},
  { name: 'Transport',  color: 0xe0c840, items: fillerItems([
    'Hard Case', 'Foam Insert',
  ])},
];

// ---------------------------------------------------------------
// SCENE SETUP
// ---------------------------------------------------------------
// ---------------------------------------------------------------
// LIGHTING — single place to tune brightness/contrast for imported
// .glb models. Raise `exposure` for an overall brighter scene, raise
// `key` for stronger highlights/more contrast, raise `fill`/`ambient`
// to lift shadowed sides without flattening the look entirely.
// ---------------------------------------------------------------
const LIGHTING = { exposure: 0.95, ambient: 0.4, key: 1.0, rim: 0.35, fill: 0.4 };

// ---------------------------------------------------------------
// REAL MODEL LOOK — tuning knobs that apply ONLY to loaded .glb parts,
// never to the placeholder shapes. Raise these if your real parts still
// read dim/flat next to the placeholders once they're in.
//   envBoost:      how strongly real materials pick up studio reflections.
//                  This is usually the single biggest fix for "flat/dark"
//                  PBR materials — roughness/metalness readouts depend on
//                  having something to reflect. Try 1.5–2.5 if still dim.
//   brightness:    a straight multiply on each material's base color.
//                  1 = untouched. 1.2–1.4 is a reasonable "lift" range;
//                  higher starts to wash out texture detail.
// ---------------------------------------------------------------
const MODEL_LOOK = { envBoost: 1.6, brightness: 1.15 };

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 100);
const CAMERA_BASE = { z: 13, y: 3.4, fov: 42 };
camera.position.set(0, CAMERA_BASE.y, CAMERA_BASE.z);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
// --- color management: without this, imported .glb PBR materials (which
// expect sRGB-decoded textures + filmic response) read dark and flat next
// to the placeholder MeshStandardMaterial shapes, which don't rely on it.
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = LIGHTING.exposure;
document.body.appendChild(renderer.domElement);

// --- environment map: without this, `metalness` on imported PBR materials
// has nothing to reflect and reads flat/matte no matter how the lights are
// tuned. Generates a soft studio-room reflection once at startup. Wrapped
// defensively in case the optional RoomEnvironment script failed to load —
// the scene still looks fine (just flatter) without it.
if (typeof THREE.RoomEnvironment !== 'undefined' && typeof THREE.PMREMGenerator !== 'undefined') {
  try {
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
    pmremGenerator.dispose();
  } catch (e) {
    console.warn('[kit-turntable] environment map setup failed:', e);
  }
}

// Keeps the full ring — and a fully spread-out 12-item kit — in frame on
// any screen. On narrow/portrait viewports the ring reads much wider than
// it is tall relative to the viewport, so we widen the field of view and
// ease the camera back a touch as the aspect ratio drops.
function fitCameraToViewport() {
  const w = window.innerWidth, h = window.innerHeight;
  const aspect = w / h;
  camera.aspect = aspect;
  if (aspect < 1) {
    const narrowness = Math.min(1, (1 - aspect)); // 0 at square, ~1 at very tall/narrow
    camera.fov = CAMERA_BASE.fov + narrowness * 18;
    camera.position.z = CAMERA_BASE.z + narrowness * 4;
  } else if (aspect < 1.5) {
    const t = (1.5 - aspect) / 0.5;
    camera.fov = CAMERA_BASE.fov + t * 8;
    camera.position.z = CAMERA_BASE.z + t * 1.5;
  } else {
    camera.fov = CAMERA_BASE.fov;
    camera.position.z = CAMERA_BASE.z;
  }
  camera.lookAt(0, 0.5, 0);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
fitCameraToViewport();

scene.add(new THREE.AmbientLight(0x8899bb, LIGHTING.ambient));
const key = new THREE.DirectionalLight(0xffffff, LIGHTING.key);
key.position.set(5, 8, 6);
scene.add(key);
const rim = new THREE.DirectionalLight(0xff8a3d, LIGHTING.rim);
rim.position.set(-6, 3, -4);
scene.add(rim);
// soft top/bottom fill so the undersides of imported models (which the
// key + rim lights above don't reach) don't read as pure black
const fill = new THREE.HemisphereLight(0x9fb4d8, 0x14233a, LIGHTING.fill);
scene.add(fill);

// ground ring for grounding
const ringGeo = new THREE.RingGeometry(5.6, 5.8, 64);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x24384e, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = -Math.PI/2;
ring.position.y = -1.4;
scene.add(ring);

// --- contact shadows: cheap fake grounding (a soft radial-gradient blob,
// not a real shadow map) so boxes and items don't look like they're
// floating. One shared texture, reused across every shadow plane.
function makeContactShadowTexture() {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0, 'rgba(0,0,0,0.45)');
  g.addColorStop(0.6, 'rgba(0,0,0,0.22)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(canvas);
}
const CONTACT_SHADOW_TEXTURE = makeContactShadowTexture();
function makeContactShadow(radius = 0.6) {
  const geo = new THREE.PlaneGeometry(radius * 2, radius * 2);
  const mat = new THREE.MeshBasicMaterial({
    map: CONTACT_SHADOW_TEXTURE, transparent: true, depthWrite: false, toneMapped: false,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.raycast = () => {}; // decorative only — never intercepts clicks meant for the item/box
  return mesh;
}

// ---------------------------------------------------------------
// ASSET LOADING — drop your rendered .glb files at these paths and
// they replace the placeholder shapes automatically. If a file isn't
// found yet, the placeholder just stays put — nothing breaks.
//
// Expected folder structure, relative to this HTML file:
//   models/
//     primary/box.glb          <- the closed kit case
//     primary/lid.glb          <- optional: separate lid mesh
//     primary/transceiver-unit.glb
//     primary/antenna-mast.glb
//     ...one file per item, named after the item name...
//     donor/box.glb
//     donor/signal-splitter.glb
//     ...etc for donor, recipient, transport
// ---------------------------------------------------------------
const ASSET_BASE = './models/';
function kitSlug(name) { return name.toLowerCase().trim(); }
function itemSlug(name) { return name.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }

const gltfLoader = (typeof THREE.GLTFLoader !== 'undefined') ? new THREE.GLTFLoader() : null;

// Loads a .glb into `slot` (a Group). On success, removes the placeholder
// and adds the real model, copying slot.userData onto every mesh inside it
// so click detection keeps working exactly as before. On failure (file not
// there yet), silently keeps whatever placeholder was already in the slot.
function loadIntoSlot(slot, url, { targetSize = 1 } = {}) {
  if (!gltfLoader) return;
  gltfLoader.load(url, (gltf) => {
    const model = gltf.scene;
    // normalize scale so kit-supplied models roughly match the placeholder footprint
    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3();
    box.getSize(size);
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    const scale = targetSize / maxDim;
    box.getCenter(model.position).multiplyScalar(-scale);

    model.traverse(o => {
      if (!o.isMesh) return;
      o.userData = slot.userData;
      // brighten real, loaded materials only — placeholders never pass
      // through here, so this can't affect their look at all
      (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
        if (!m) return;
        if ('envMapIntensity' in m) m.envMapIntensity = MODEL_LOOK.envBoost;
        if (m.color) m.color.multiplyScalar(MODEL_LOOK.brightness);
        m.needsUpdate = true;
      });
    });

    // clear the placeholder (but never the contact-shadow plane, which is
    // a permanent child of the same slot) and dispose its GPU resources
    [...slot.children].forEach(child => {
      if (child.userData && child.userData.isContactShadow) return;
      slot.remove(child);
      child.traverse(o => {
        if (!o.isMesh) return;
        o.geometry?.dispose();
        (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m?.dispose());
      });
    });
    slot.add(model);

    // pop the real model in at a tiny scale rather than snapping straight
    // to full size, so the placeholder->real swap doesn't hard-cut
    model.scale.setScalar(scale * 0.01);
    tween(model.scale, { x: scale, y: scale, z: scale }, 350, { ease: easeOutCubic });

    // if the kit's model brings its own baked animation (e.g. lid opening),
    // wire it up so it's available to play instead of the manual tween
    if (gltf.animations && gltf.animations.length) {
      slot.userData.mixer = new THREE.AnimationMixer(model);
      slot.userData.clips = gltf.animations;
    }
  }, undefined, () => {
    // no file at this path yet — keep the placeholder. Logged (not shown to
    // the user) so a typo'd filename during asset integration isn't silent.
    console.warn(`[kit-turntable] no asset at "${url}" — keeping placeholder.`);
  });
}

// ---------------------------------------------------------------
// BUILD KITS
// ---------------------------------------------------------------
const RADIUS = 5;
// --- size controls, all in one place ---
// BOX_TARGET_SIZE / ITEM_TARGET_SIZE: the "natural" size an imported .glb
// is normalized to on load (its largest dimension becomes this many world
// units) — this is the size on the turntable / just after the kit opens.
// INSPECT_FILL_FRACTION: how much of the viewport height an item fills
// once you click to inspect it (0.36 = 36% of frame height).
const BOX_TARGET_SIZE = 1.6;
const ITEM_TARGET_SIZE = 0.9;
const INSPECT_FILL_FRACTION = 0.36;
// per-item scale override, keyed by the exact item name — everything
// normalizes to ITEM_TARGET_SIZE by default (so a tiny screw and a big
// antenna mast would otherwise both read the same size); use this to
// restore real proportions between parts without re-exporting from Max.
// Example: ITEM_SIZE_OVERRIDES = { 'Antenna Mast': 1.3, 'Sealing Tape': 0.6 };
const ITEM_SIZE_OVERRIDES = {};
// how big items render once a kit is opened/exploded, tiered by item count
// so crowded kits (Donor/Recipient, 10 items) still fit the arc
const EXPLODED_SCALE_BY_COUNT = { low: 1, mid: 0.75, high: 0.58 };
// how far (world units, straight down) the turntable ring, the 3 unopened
// kits, and the active kit's own box/lid drop out of frame once a kit is
// open — leaves a neutral background so the items read clearly on their own
const SLIDE_OUT_Y = -8;
const BASE_SLOT_HOME_Y = -0.1;
const LID_PIVOT_HOME_Y = 0.35;
const ROOT_HOME_Y = 0;
const RING_HOME_Y = -1.4;
const turntableGroup = new THREE.Group();
scene.add(turntableGroup);

function makeShape(shapeType, color, size=1) {
  let geo;
  switch(shapeType) {
    case 'cylinder': geo = new THREE.CylinderGeometry(0.35*size, 0.35*size, 0.9*size, 24); break;
    case 'cone':      geo = new THREE.ConeGeometry(0.4*size, 0.9*size, 24); break;
    case 'torus':     geo = new THREE.TorusGeometry(0.35*size, 0.12*size, 12, 32); break;
    default:          geo = new THREE.BoxGeometry(0.6*size, 0.5*size, 0.6*size); break;
  }
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.25 });
  return new THREE.Mesh(geo, mat);
}

const kitObjects = []; // { root, baseSlot, lid, items[], data, homeAngle }

KITS.forEach((data, i) => {
  const angle = (i / KITS.length) * Math.PI * 2;
  const root = new THREE.Group();
  root.position.set(Math.cos(angle)*RADIUS, 0, Math.sin(angle)*RADIUS);
  root.rotation.y = -angle + Math.PI/2;

  const kitUserData = { kitIndex: i, name: data.name, clickable: true };

  // box base — a slot that starts with a placeholder and upgrades to your .glb
  const baseSlot = new THREE.Group();
  baseSlot.userData = kitUserData;
  baseSlot.position.y = -0.1;
  root.add(baseSlot);
  const baseMat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.55, metalness: 0.15 });
  const basePlaceholder = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.9, 1.1), baseMat);
  basePlaceholder.userData = kitUserData;
  baseSlot.add(basePlaceholder);
  const baseShadow = makeContactShadow(1.1);
  baseShadow.position.y = -0.46;
  baseShadow.userData = { isContactShadow: true };
  baseSlot.add(baseShadow);
  loadIntoSlot(baseSlot, `${ASSET_BASE}${kitSlug(data.name)}/box.glb`, { targetSize: BOX_TARGET_SIZE });

  // lid — optional separate slot; falls back to a simple hinged primitive
  const lidPivot = new THREE.Group();
  lidPivot.position.set(0, 0.35, -0.55);
  root.add(lidPivot);
  const lidSlot = new THREE.Group();
  lidSlot.position.set(0, 0, 0.55);
  lidPivot.add(lidSlot);
  const lidPlaceholder = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.15, 1.1), baseMat.clone());
  lidSlot.add(lidPlaceholder);
  lidSlot.userData = kitUserData;
  loadIntoSlot(lidSlot, `${ASSET_BASE}${kitSlug(data.name)}/lid.glb`, { targetSize: BOX_TARGET_SIZE });

  // items — each is its own slot, starts hidden inside the box
  const items = data.items.map((it, idx) => {
    const itemUserData = { name: it.name, kitIndex: i, itemIndex: idx };
    const slot = new THREE.Group();
    slot.position.set(0, -0.1, 0);
    slot.scale.setScalar(0.001); // hidden until the kit opens
    slot.userData = itemUserData;
    const placeholder = makeShape(it.shape, 0xffffff);
    placeholder.material.color.set(new THREE.Color(data.color).lerp(new THREE.Color(0xffffff), 0.35));
    placeholder.userData = itemUserData;
    slot.add(placeholder);
    const itemShadow = makeContactShadow(0.5);
    itemShadow.position.y = -0.46;
    itemShadow.userData = { isContactShadow: true };
    slot.add(itemShadow);
    root.add(slot);
    const itemSize = ITEM_TARGET_SIZE * (ITEM_SIZE_OVERRIDES[it.name] || 1);
    loadIntoSlot(slot, `${ASSET_BASE}${kitSlug(data.name)}/${itemSlug(it.name)}.glb`, { targetSize: itemSize });
    return slot;
  });

  root.userData = kitUserData;

  turntableGroup.add(root);
  kitObjects.push({ root, baseSlot, lidPivot, lidSlot, items, data, homeAngle: angle });
});

// legend
const legendEl = document.getElementById('legend');
KITS.forEach((k, i) => {
  const chip = document.createElement('div');
  chip.className = 'kit-chip';
  chip.id = 'chip-' + i;
  chip.innerHTML = `<span class="swatch" style="background:#${k.color.toString(16).padStart(6,'0')}"></span>${k.name} Kit`;
  legendEl.appendChild(chip);
});

// ---------------------------------------------------------------
// TWEEN HELPER
// ---------------------------------------------------------------
function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function tween(obj, to, duration, { ease = easeInOutCubic, onUpdate, onComplete } = {}) {
  const d = REDUCED_MOTION ? 0 : duration;
  if (d <= 0) {
    Object.keys(to).forEach(k => obj[k] = to[k]);
    if (onUpdate) onUpdate(1);
    if (onComplete) onComplete();
    return;
  }
  const from = {};
  Object.keys(to).forEach(k => from[k] = obj[k]);
  const start = performance.now();
  function step(now) {
    const t = Math.min(1, (now - start) / d);
    const e = ease(t);
    Object.keys(to).forEach(k => { obj[k] = from[k] + (to[k] - from[k]) * e; });
    if (onUpdate) onUpdate(t);
    if (t < 1) requestAnimationFrame(step);
    else if (onComplete) onComplete();
  }
  requestAnimationFrame(step);
}

// The world angle (around the ring) that counts as "front" — the point on
// the ring closest to the camera. Kits keep their own fixed local slot and
// orientation forever; the only thing that ever moves is the ring's
// rotation, so a kit never changes distance from camera or gets rescaled.
const FRONT_ANGLE = Math.PI / 2;

// Shortest signed angular delta from `from` to `to` (radians), so the ring
// always takes the short way around instead of spinning past full circles.
function shortestAngleDelta(from, to) {
  let d = (to - from) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return d;
}

// ---------------------------------------------------------------
// STATE MACHINE
// ---------------------------------------------------------------
let STATE = 'turntable'; // turntable | opening | exploded | inspecting
let activeKit = null;
let activeItem = null;
let idleSpin = true;

const backBtn = document.getElementById('backBtn');
const breadcrumb = document.getElementById('breadcrumb');

function setBreadcrumb(text) { breadcrumb.innerHTML = text; }

function updateLegendActive() {
  document.querySelectorAll('.kit-chip').forEach((c, i) => {
    c.classList.toggle('active', activeKit && activeKit.data === KITS[i]);
  });
}

function goToTurntable() {
  activeItem = null;
  const kit = activeKit;
  activeKit = null;
  updateLegendActive();
  backBtn.hidden = true;
  setBreadcrumb('Turntable');
  document.getElementById('calloutLabel').classList.remove('active');
  document.getElementById('calloutSvg').classList.remove('active');

  // flip back to 'turntable' immediately (not after the retract animation
  // finishes) so a fast next click on another kit is never silently dropped
  // while this one is still tweening closed in the background
  STATE = 'turntable';
  idleSpin = true;

  if (kit) {
    // retract items back into box, close lid, ease the kit's own scale back down —
    // the ring itself just keeps sitting at its current angle, nothing to undo
    kit.items.forEach(m => tween(m.scale, { x: 0.001, y: 0.001, z: 0.001 }, 500));
    tween(kit.lidPivot.rotation, { x: 0 }, 500);
    tween(kit.root.scale, { x: 1, y: 1, z: 1 }, 500);
  }
  slideBackgroundIn(kit);
}

function openKit(kitObj) {
  STATE = 'opening';
  idleSpin = false;
  activeKit = kitObj;
  updateLegendActive();
  backBtn.hidden = false;
  setBreadcrumb(`Turntable &rarr; <span class="current">${kitObj.data.name} Kit</span>`);

  // Rotate the WHOLE ring so this kit's existing slot swings to the front —
  // computed by actually rotating the kit's local direction vector with
  // Three.js's own rotation math (rather than a hand-derived formula), so
  // there's no risk of a sign error sending the wrong kit to front.
  const localDir = new THREE.Vector3(Math.cos(kitObj.homeAngle), 0, Math.sin(kitObj.homeAngle));
  const frontDir = new THREE.Vector3(Math.cos(FRONT_ANGLE), 0, Math.sin(FRONT_ANGLE));
  const cross = new THREE.Vector3().crossVectors(localDir, frontDir);
  const dot = localDir.dot(frontDir);
  const targetAbsoluteY = Math.atan2(cross.y, dot);
  const targetRotY = turntableGroup.rotation.y + shortestAngleDelta(turntableGroup.rotation.y, targetAbsoluteY);
  tween(turntableGroup.rotation, { y: targetRotY }, 800, {
    onComplete: () => openLidAndSpread(kitObj)
  });
  tween(kitObj.root.scale, { x: 1.15, y: 1.15, z: 1.15 }, 800);
}

function openLidAndSpread(kitObj) {
  tween(kitObj.lidPivot.rotation, { x: -Math.PI * 0.65 }, 500, {
    onComplete: () => spreadItems(kitObj)
  });
}

// Shared layout: fans items across one or two arced rows depending on count,
// and shrinks them as the count grows so 10-12 item kits don't overlap.
function layoutFor(n, idx) {
  const rows = n > 6 ? 2 : 1;
  const rowCount = rows === 1 ? n : (idx < Math.ceil(n / 2) ? Math.ceil(n / 2) : Math.floor(n / 2));
  const rowIndex = rows === 1 ? 0 : (idx < Math.ceil(n / 2) ? 0 : 1);
  const idxInRow = rows === 1 ? idx : (rowIndex === 0 ? idx : idx - Math.ceil(n / 2));
  const t = rowCount === 1 ? 0.5 : idxInRow / (rowCount - 1);
  const arcSpread = Math.min(3.4, 1.0 + rowCount * 0.42);
  // exploded-view size: shrinks items as a kit's item count grows so
  // 10-12 item kits don't overlap. Tune EXPLODED_SCALE_BY_COUNT below.
  const scale = n <= 4 ? EXPLODED_SCALE_BY_COUNT.low : n <= 8 ? EXPLODED_SCALE_BY_COUNT.mid : EXPLODED_SCALE_BY_COUNT.high;
  return {
    x: (t - 0.5) * arcSpread * 2,
    y: (1.05 + rowIndex * 1.05) + Math.sin(t * Math.PI) * 0.4,
    z: 0.15 - rowIndex * 0.55,
    scale,
  };
}

function spreadItems(kitObj) {
  STATE = 'exploded';
  const n = kitObj.items.length;
  kitObj.items.forEach((m, idx) => {
    const L = layoutFor(n, idx);
    tween(m.scale, { x: L.scale, y: L.scale, z: L.scale }, 500);
    tween(m.position, { x: L.x, y: L.y, z: L.z }, 650, { ease: easeInOutCubic });
  });
  slideBackgroundOut(kitObj);
}

// Drops the ring, the 3 unopened kits, and the active kit's own box/lid
// straight down out of frame so the items are left against a clean,
// neutral background. Items themselves are untouched — they're siblings
// of baseSlot/lidPivot under kitObj.root, not children of either, so this
// doesn't affect their position.
function slideBackgroundOut(kitObj) {
  kitObjects.forEach(k => {
    if (k !== kitObj) tween(k.root.position, { y: SLIDE_OUT_Y }, 600, { ease: easeInOutCubic });
  });
  tween(kitObj.baseSlot.position, { y: BASE_SLOT_HOME_Y + SLIDE_OUT_Y }, 600, { ease: easeInOutCubic });
  tween(kitObj.lidPivot.position, { y: LID_PIVOT_HOME_Y + SLIDE_OUT_Y }, 600, { ease: easeInOutCubic });
  tween(ring.position, { y: RING_HOME_Y + SLIDE_OUT_Y }, 600, { ease: easeInOutCubic });
}

// Brings everything back up to its resting position on the way back to the turntable.
function slideBackgroundIn(kitObj) {
  kitObjects.forEach(k => tween(k.root.position, { y: ROOT_HOME_Y }, 500, { ease: easeInOutCubic }));
  if (kitObj) {
    tween(kitObj.baseSlot.position, { y: BASE_SLOT_HOME_Y }, 500, { ease: easeInOutCubic });
    tween(kitObj.lidPivot.position, { y: LID_PIVOT_HOME_Y }, 500, { ease: easeInOutCubic });
  }
  tween(ring.position, { y: RING_HOME_Y }, 500, { ease: easeInOutCubic });
}

// Computes where an inspected item needs to sit — in its own kit's LOCAL
// coordinate space, not world space — so it lands exactly at true screen
// center regardless of the kit's current position/rotation/scale on the
// ring, and regardless of viewport size or aspect ratio. Reused on click
// and again on resize, so the item stays centered if the window changes
// size while it's being inspected.
function computeInspectTransform(kitObj, mesh) {
  kitObj.root.updateMatrixWorld(true);

  // real bounding box → true diameter, independent of any current scaling
  const worldBox = new THREE.Box3().setFromObject(mesh);
  const worldSize = new THREE.Vector3();
  worldBox.getSize(worldSize);
  const parentWorldScale = kitObj.root.getWorldScale(new THREE.Vector3()).x || 1;
  const effectiveScale = (mesh.scale.x || 1) * parentWorldScale;
  const naturalDiameter = (Math.max(worldSize.x, worldSize.y, worldSize.z) / effectiveScale) || 1;

  // pick a scale that fills a fixed, safe fraction of the actual current frame
  const inspectDistance = 6.5; // world units out in front of the camera
  const vFov = camera.fov * Math.PI / 180;
  const visibleHeight = 2 * Math.tan(vFov / 2) * inspectDistance;
  const targetDiameter = visibleHeight * INSPECT_FILL_FRACTION; // leaves room for the callout tag
  const localScale = Math.max(0.5, Math.min(2.5, targetDiameter / (naturalDiameter * parentWorldScale)));

  // dead-center point, straight down the camera's current look direction —
  // then converted into the kit's local space, since that's the space
  // `mesh.position` actually lives in
  const camDir = new THREE.Vector3();
  camera.getWorldDirection(camDir);
  const worldTarget = camera.position.clone().addScaledVector(camDir, inspectDistance);
  const localTarget = kitObj.root.worldToLocal(worldTarget.clone());

  return { localTarget, localScale };
}

function inspectItem(kitObj, mesh) {
  STATE = 'inspecting';
  activeItem = mesh;
  setBreadcrumb(`Turntable &rarr; ${kitObj.data.name} Kit &rarr; <span class="current">${mesh.userData.name}</span>`);

  const { localTarget, localScale } = computeInspectTransform(kitObj, mesh);
  tween(mesh.position, { x: localTarget.x, y: localTarget.y, z: localTarget.z }, 550, { ease: easeInOutCubic });
  tween(mesh.scale, { x: localScale, y: localScale, z: localScale }, 550);

  document.getElementById('calloutKit').textContent = kitObj.data.name + ' Kit / Component';
  document.getElementById('calloutName').textContent = mesh.userData.name;
  document.getElementById('calloutLabel').classList.add('active');
  document.getElementById('calloutSvg').classList.add('active');
  document.getElementById('vignette').classList.add('active');
}

function backFromInspect(kitObj, mesh) {
  STATE = 'exploded';
  activeItem = null;
  setBreadcrumb(`Turntable &rarr; <span class="current">${kitObj.data.name} Kit</span>`);
  document.getElementById('calloutLabel').classList.remove('active');
  document.getElementById('calloutSvg').classList.remove('active');
  document.getElementById('vignette').classList.remove('active');

  const idx = mesh.userData.itemIndex;
  const n = kitObj.items.length;
  const L = layoutFor(n, idx);
  tween(mesh.position, { x: L.x, y: L.y, z: L.z }, 450);
  tween(mesh.scale, { x: L.scale, y: L.scale, z: L.scale }, 450);
}

// Projects the inspected item's world position to screen space and
// positions the leader line + tag so it always points at the spinning item.
const _projVec = new THREE.Vector3();
function updateCallout() {
  if (STATE !== 'inspecting' || !activeItem) return;
  activeItem.getWorldPosition(_projVec);
  _projVec.project(camera);
  const sx = (_projVec.x * 0.5 + 0.5) * window.innerWidth;
  const sy = (-_projVec.y * 0.5 + 0.5) * window.innerHeight;

  const labelEl = document.getElementById('calloutLabel');
  const offsetX = 130, offsetY = -70;
  const lx = Math.min(window.innerWidth - 240, sx + offsetX);
  const ly = Math.max(20, sy + offsetY);
  labelEl.style.left = lx + 'px';
  labelEl.style.top = ly + 'px';

  const line = document.getElementById('calloutLine');
  const dot = document.getElementById('calloutDot');
  dot.setAttribute('cx', sx); dot.setAttribute('cy', sy);
  line.setAttribute('x1', sx); line.setAttribute('y1', sy);
  line.setAttribute('x2', lx); line.setAttribute('y2', ly + 14);
}

backBtn.addEventListener('click', () => {
  if (STATE === 'inspecting' && activeKit && activeItem) {
    backFromInspect(activeKit, activeItem);
  } else if (STATE === 'exploded' && activeKit) {
    goToTurntable();
  } else if (STATE === 'opening') {
    // ignore mid-transition
  } else if (activeKit) {
    goToTurntable();
  }
});

// ---------------------------------------------------------------
// RAYCASTING / CLICKS
// ---------------------------------------------------------------
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('click', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  if (STATE === 'turntable') {
    const slots = kitObjects.map(k => k.baseSlot);
    const hits = raycaster.intersectObjects(slots, true); // true = check inside loaded .glb meshes too
    if (hits.length) {
      const kitIndex = hits[0].object.userData.kitIndex;
      openKit(kitObjects[kitIndex]);
    }
  } else if (STATE === 'exploded' && activeKit) {
    const hits = raycaster.intersectObjects(activeKit.items, true);
    if (hits.length) {
      // resolve the leaf mesh hit back to its item slot (the thing we actually animate)
      const itemIndex = hits[0].object.userData.itemIndex;
      inspectItem(activeKit, activeKit.items[itemIndex]);
    } else {
      // clicked empty space — same as hitting Back
      goToTurntable();
    }
  } else if (STATE === 'inspecting' && activeKit && activeItem) {
    // clicking the inspected item, OR anywhere outside it, returns it to the arc
    backFromInspect(activeKit, activeItem);
  }
});

// simple hover cursor feedback
renderer.domElement.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  let hoverable = [];
  if (STATE === 'turntable') hoverable = kitObjects.map(k => k.baseSlot);
  else if (STATE === 'exploded' && activeKit) hoverable = activeKit.items;
  const hits = raycaster.intersectObjects(hoverable, true);
  renderer.domElement.style.cursor = hits.length ? 'pointer' : 'grab';
});

// ---------------------------------------------------------------
// DRAG TO ORBIT (manual rotation of the whole scene view when idle)
// ---------------------------------------------------------------
let isDragging = false, lastX = 0;
renderer.domElement.addEventListener('mousedown', (e) => { isDragging = true; lastX = e.clientX; });
window.addEventListener('mouseup', () => isDragging = false);
window.addEventListener('mousemove', (e) => {
  if (!isDragging || STATE !== 'turntable') return;
  const dx = e.clientX - lastX;
  lastX = e.clientX;
  turntableGroup.rotation.y += dx * 0.005;
});

// touch equivalents (single-finger drag) — same behavior, no pinch/zoom handling here
renderer.domElement.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  isDragging = true;
  lastX = e.touches[0].clientX;
}, { passive: true });
window.addEventListener('touchend', () => isDragging = false);
window.addEventListener('touchcancel', () => isDragging = false);
window.addEventListener('touchmove', (e) => {
  if (!isDragging || STATE !== 'turntable' || !e.touches.length) return;
  const dx = e.touches[0].clientX - lastX;
  lastX = e.touches[0].clientX;
  turntableGroup.rotation.y += dx * 0.005;
}, { passive: true });

// keyboard: Esc steps back one level, same as the Back button / clicking outside
window.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (STATE === 'inspecting' && activeKit && activeItem) backFromInspect(activeKit, activeItem);
  else if (STATE === 'exploded' && activeKit) goToTurntable();
});

// ---------------------------------------------------------------
// RENDER LOOP
// ---------------------------------------------------------------
function animate() {
  requestAnimationFrame(animate);
  if (idleSpin && STATE === 'turntable' && !REDUCED_MOTION) {
    turntableGroup.rotation.y += 0.0035;
  }
  if (STATE === 'inspecting' && activeItem && !REDUCED_MOTION) {
    activeItem.rotation.y += 0.005;
  }
  updateCallout();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  fitCameraToViewport();
  // if an item is currently zoomed in, re-center it for the new viewport
  // instantly (no tween) so it never drifts off-frame after a resize
  if (STATE === 'inspecting' && activeKit && activeItem) {
    const { localTarget, localScale } = computeInspectTransform(activeKit, activeItem);
    activeItem.position.copy(localTarget);
    activeItem.scale.setScalar(localScale);
  }
});
</script>
</body>
</html>
